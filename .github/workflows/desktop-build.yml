name: Build Desktop Application (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: Ossilith-Windows-Setup.exe
            dist_path: electron/dist/*.exe
          - os: macos-latest
            artifact_name: Ossilith-macOS.dmg
            dist_path: electron/dist/*.dmg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Backend Dependencies & PyInstaller
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Python Backend Binary
        run: |
          cd backend
          python build_desktop_backend.py

      - name: Install Frontend & Electron Dependencies
        run: |
          cd frontend
          npm install
          npm run build
          cd ../electron
          npm install

      - name: Package Desktop Executable (${{ matrix.os }})
        run: |
          cd electron
          npm run dist

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}
