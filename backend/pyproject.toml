[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "ossilith-backend"
version = "0.1.0"
description = "Ossilith — CT DICOM to surgical planning STL pipeline"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # DICOM & medical imaging
    "pydicom>=2.4.0",
    "SimpleITK>=2.3.0",
    "numpy>=1.26.0",

    # Mesh processing
    "vtk>=9.3.0",
    "trimesh>=4.4.0",
    "scipy>=1.13.0",
    "scikit-image>=0.22.0",

    # nnInteractive client (torch-free)
    "nninteractive-client>=1.0.0",
    "blosc2>=2.6.0",

    # Config
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Image rendering
    "Pillow>=10.0.0",

    # Sync DB driver (for Celery workers)
    "psycopg2-binary>=2.9.0",
    "nibabel>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
local-gpu = [
    # Full nnInteractive and TotalSegmentator packages for local GPU / inference mode
    "nnInteractive>=1.0.0",
    "TotalSegmentator>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
