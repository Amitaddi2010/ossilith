<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ossilith Starting...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0c2f10;
      color: #fffefc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .card {
      text-align: center;
      padding: 32px;
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .subtitle {
      font-size: 13px;
      color: #b1dbb8;
      margin-bottom: 28px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .progress-track {
      width: 260px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      overflow: hidden;
      margin: 0 auto 12px;
      position: relative;
    }
    .progress-bar {
      width: 30%;
      height: 100%;
      background: #b1dbb8;
      border-radius: 99px;
      position: absolute;
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -30%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
    .status-text {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span style="font-size: 30px;">🦴</span>
      <span>Ossilith</span>
    </div>
    <div class="subtitle">Clinical 3D Surgical CAD & AI</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div id="status" class="status-text">Initializing local AI engine & CAD workspace...</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('status-update', (event, message) => {
      document.getElementById('status').innerText = message;
    });
  </script>
</body>
</html>
